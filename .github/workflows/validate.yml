name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: glib-compile-schemas --strict --dry-run schemas
      - run: bash -n install.sh tools/audit-keychron-combos.sh
      - run: python3 -m py_compile tools/parse-keychron-audit.py
